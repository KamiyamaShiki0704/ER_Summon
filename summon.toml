marker_speffect = 14200128
vanish_request_speffect = 14200129
generated_team_type = 47
max_active_summons = 8
start_delay_ms = 5000
unbound_timeout_ms = 2000
fallback_lifetime_ms = 10000
# Position offsets use camera-local horizontal axes plus world height:
# offset_forward: positive = toward the camera view direction, negative = backward
# offset_right: positive = camera-right, negative = camera-left
# offset_up: positive = upward, negative = downward
offset_forward = 2.8
offset_right = 0.0
offset_up = 0.05
same_trigger_cooldown_ms = 350
any_trigger_cooldown_ms = 120
reuse_spawned_units = true
disable_lock_on = false

# How a summon leaves the world:
#   "destroy" (default) - release its event ids, run the engine destructor and
#                         clear its character set entry, so the unit is really
#                         gone from memory. Forces reuse_spawned_units off.
#   "hide"              - only field writes; the unit stays resident and can be
#                         reused, which is the older behavior.
remove_mode = "destroy"

# Grace period between making a unit inert and freeing it. 0 destroys on the
# next tick; raise it if another system still needs to observe the unit.
destroy_delay_ms = 0

# Writes each configured event_entity_id onto the summon and registers it in the
# character set so event scripts can resolve it back to the unit.
register_event_entity_id = true

# Appends lifecycle evidence to summon.log next to the DLL: what every bind
# settled on and whether every removal really cleared the character set entry.
log_enabled = true

# The following global fields can also be set inside a [[summons]] entry.
# Entry values override the global value only for that summon:
# marker_speffect, vanish_request_speffect, generated_team_type,
# fallback_lifetime_ms, offset_forward, offset_right, offset_up,
# disable_lock_on.

# event_entity_id is the id event scripts use to find and control this summon.
# 0 means "do not register an id" and keeps the unit reachable only through its
# handle. Pick a number that is free in your own event id space: the mod refuses
# ids another character in the same character set already owns and says so in
# summon.log, and it warns when a configured id does not resolve back to the
# unit. Example for the first entry: event_entity_id = 42050001

[[summons]]
trigger_speffect = 14200120
chr_id = 4205
chara_init_param_id = 0
npc_param_id = 42050100
npc_think_param_id = 42050000
event_entity_id = 0
talk_id = 0
animation_id = 20010
offset_right = -1.25
is_player = false
