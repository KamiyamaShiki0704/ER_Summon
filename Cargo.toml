[package]
name = "nightreign-attack-summon"
version = "0.14.0"
edition = "2024"
repository = "https://github.com/KamiyamaShiki0704/ER_Summon"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
eldenring = { git = "https://github.com/KamiyamaShiki0704/fromsoftware-rs", rev = "02fa5681e27fd2ecd9da79d34aef9fae96805539" }
fromsoftware-shared = { git = "https://github.com/KamiyamaShiki0704/fromsoftware-rs", rev = "02fa5681e27fd2ecd9da79d34aef9fae96805539" }
toml = "1.1.4"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_System_Kernel",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
]

[lib]
name = "summon"
crate-type = ["cdylib"]

[profile.release]
# Keep the release artifact in the same shape as an ordinary development
# build: debug info present, symbols intact. A stripped, size-minimized
# cdylib that lives inside another process and rewrites its memory matches
# the heuristic profile of a packed payload, and endpoint security agents
# flag it intermittently. Keeping the symbols also makes crash triage
# possible, which a stripped build cannot offer.
debug = 2
strip = "none"
